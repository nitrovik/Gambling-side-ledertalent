<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fight Night — Ledertalent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%8A%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="embers" aria-hidden="true"></div>

  <header class="hero">
    <p class="eyebrow">Ledertalent presenterer</p>
    <h1 class="ring-title">FIGHT NIGHT</h1>
    <p class="tagline">Fire ledertyper. To kamper. Gambl på vinneren! 🥊</p>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <p>Ledertalent-programmet · Fight Night 🥊</p>
  </footer>

  <aside id="betslip" class="betslip" aria-label="Bongen din" hidden></aside>
  <div id="toast" class="toast" role="status" hidden></div>

  <canvas id="confetti-canvas"></canvas>

  <div id="announcement-overlay" class="announcement-overlay" hidden>
    <div class="announcement-card">
      <button class="announcement-close" data-action="close-announcement" aria-label="Lukk">✕</button>
      <div id="announcement-content"></div>
    </div>
  </div>

  <script src="confetti.js"></script>
  <script src="embers.js"></script>
  <script src="app.js"></script>
</body>
</html>
